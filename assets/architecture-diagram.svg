<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CrisisOps Agent Architecture</title>
  <desc id="desc">Architecture diagram showing Slack users, Slack Agent Builder, Real-Time Search, agent modules, MCP gateway, external systems, audit logs, and demo preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#241436"/>
      <stop offset="52%" stop-color="#23323f"/>
      <stop offset="100%" stop-color="#122f2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#36c5f0"/>
      <stop offset="35%" stop-color="#2eb67d"/>
      <stop offset="70%" stop-color="#ecb22e"/>
      <stop offset="100%" stop-color="#e01e5a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c8d3dc"/>
    </marker>
    <style>
      .title{font:700 48px Inter,Arial,sans-serif;fill:#fff}
      .subtitle{font:400 22px Inter,Arial,sans-serif;fill:#d7e3ea}
      .box{fill:#f8fbfc;stroke:#d8e1e7;stroke-width:2;rx:22;filter:url(#shadow)}
      .boxDark{fill:#17222b;stroke:#3f5362;stroke-width:2;rx:22;filter:url(#shadow)}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#17222b}
      .labelDark{font:700 25px Inter,Arial,sans-serif;fill:#fff}
      .small{font:400 18px Inter,Arial,sans-serif;fill:#3e4d57}
      .smallDark{font:400 18px Inter,Arial,sans-serif;fill:#d7e3ea}
      .pill{fill:#eef6f8;stroke:#bed5df;stroke-width:1.5;rx:18}
      .pillText{font:600 16px Inter,Arial,sans-serif;fill:#24333c}
      .line{stroke:#c8d3dc;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#9db4c0;stroke-width:3;stroke-dasharray:9 9;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="56" y="44" width="1488" height="812" rx="36" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="92" y="104" class="title">CrisisOps Agent Architecture</text>
  <text x="94" y="142" class="subtitle">A Slack-native command center that turns chaotic incident conversations into coordinated action.</text>
  <rect x="92" y="166" width="360" height="8" rx="4" fill="url(#accent)"/>

  <rect x="94" y="230" width="280" height="152" class="box"/>
  <text x="124" y="278" class="label">Slack Workspace</text>
  <text x="124" y="314" class="small">Channels, DMs, slash commands,</text>
  <text x="124" y="340" class="small">app mentions, buttons, modals</text>
  <rect x="122" y="356" width="98" height="34" class="pill"/>
  <text x="145" y="378" class="pillText">/crisisops</text>

  <rect x="478" y="224" width="296" height="170" class="box"/>
  <text x="508" y="272" class="label">Slack Agent Builder</text>
  <text x="508" y="308" class="small">Bolt app surfaces plus</text>
  <text x="508" y="334" class="small">Socket Mode transport</text>
  <rect x="508" y="354" width="98" height="34" class="pill"/>
  <text x="532" y="376" class="pillText">Block Kit</text>
  <rect x="618" y="354" width="94" height="34" class="pill"/>
  <text x="640" y="376" class="pillText">App Home</text>

  <rect x="880" y="178" width="292" height="128" class="boxDark"/>
  <text x="910" y="225" class="labelDark">Real-Time Search</text>
  <text x="910" y="260" class="smallDark">Finds blockers, urgency,</text>
  <text x="910" y="286" class="smallDark">owners, decisions, evidence</text>

  <rect x="880" y="358" width="292" height="166" class="boxDark"/>
  <text x="910" y="405" class="labelDark">Agent Orchestrator</text>
  <text x="910" y="441" class="smallDark">Intent router, context retriever,</text>
  <text x="910" y="467" class="smallDark">briefing, matching, postmortem</text>
  <rect x="910" y="486" width="108" height="34" class="pill"/>
  <text x="936" y="508" class="pillText">Guardrails</text>
  <rect x="1030" y="486" width="94" height="34" class="pill"/>
  <text x="1055" y="508" class="pillText">Prompts</text>

  <rect x="1272" y="230" width="234" height="152" class="box"/>
  <text x="1302" y="276" class="label">MCP Gateway</text>
  <text x="1302" y="312" class="small">Inventory, tickets,</text>
  <text x="1302" y="338" class="small">status, ETA, on-call</text>
  <rect x="1302" y="356" width="126" height="34" class="pill"/>
  <text x="1327" y="378" class="pillText">Tool audit</text>

  <rect x="1262" y="478" width="252" height="212" class="box"/>
  <text x="1292" y="525" class="label">External Systems</text>
  <text x="1292" y="560" class="small">Google Sheets / Airtable</text>
  <text x="1292" y="586" class="small">Jira / Linear</text>
  <text x="1292" y="612" class="small">PagerDuty / Opsgenie</text>
  <text x="1292" y="638" class="small">Salesforce / Zendesk</text>
  <text x="1292" y="664" class="small">Maps / Statuspage</text>

  <rect x="470" y="530" width="320" height="176" class="boxDark"/>
  <text x="500" y="578" class="labelDark">State + Audit Layer</text>
  <text x="500" y="614" class="smallDark">Incidents, tasks, decisions,</text>
  <text x="500" y="640" class="smallDark">briefings, tool calls, approvals</text>
  <rect x="500" y="662" width="112" height="34" class="pill"/>
  <text x="529" y="684" class="pillText">Postgres</text>
  <rect x="624" y="662" width="98" height="34" class="pill"/>
  <text x="649" y="684" class="pillText">Demo DB</text>

  <rect x="94" y="532" width="286" height="172" class="box"/>
  <text x="124" y="580" class="label">Web Preview</text>
  <text x="124" y="616" class="small">Local demo control center</text>
  <text x="124" y="642" class="small">for judges and recording</text>
  <rect x="124" y="666" width="142" height="34" class="pill"/>
  <text x="145" y="688" class="pillText">localhost:3000</text>

  <path d="M374 306 C420 306 432 306 478 306" class="line"/>
  <path d="M774 306 C824 284 830 256 880 244" class="line"/>
  <path d="M774 332 C824 366 828 420 880 442" class="line"/>
  <path d="M1172 442 C1220 408 1228 320 1272 306" class="line"/>
  <path d="M1388 382 L1388 478" class="line"/>
  <path d="M880 482 C828 540 834 606 790 618" class="line"/>
  <path d="M470 618 C430 618 420 618 380 618" class="dash"/>

  <rect x="92" y="760" width="1414" height="54" rx="20" fill="#101820" opacity="0.62" stroke="#405463"/>
  <text x="120" y="795" class="smallDark">Demo flow: Chaos Radar detects incident → Open command center → Generate sourced brief → Match resources via MCP → Approve update → Record decision → Generate postmortem</text>
</svg>
