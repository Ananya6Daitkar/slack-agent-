services:
  - type: web
    name: crisisops-agent
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
      - key: DEMO_MODE
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: SLACK_USER_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_SOCKET_MODE
        value: "false"
